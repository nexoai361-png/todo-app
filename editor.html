<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Simple Code Editor</title>
    <style>
        html, body, #container {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #editor {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="editor"></div>
    </div>

    <!-- Load Monaco Editor from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>
    <script>
        window.require = { paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.47.0/min/vs' }};
    </script>
    <script>
        require(['vs/editor/editor.main'], function () {
            // Create the editor
            const editor = monaco.editor.create(document.getElementById('editor'), {
                value: `// Welcome to the editor!\n// Type your code here\n\nfunction helloWorld() {\n    console.log('Hello, World!');\n}\n\nhelloWorld();\n`,
                language: 'javascript',
                theme: 'vs-dark',
                automaticLayout: true
            });

            // Handle Ctrl+S to save (demo)
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, function() {
                const code = editor.getValue();
                console.log('Code to save:', code);
                alert('Code saved! (In a real app, this would save to a file)');
            });
        });
    </script>
</body>
</html>
